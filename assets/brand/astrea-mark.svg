<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Astrea">
  <title>Astrea</title>
  <defs>
    <linearGradient id="astrea-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F8466"/>
      <stop offset="1" stop-color="#10513E"/>
    </linearGradient>
    <radialGradient id="astrea-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#astrea-bg)"/>

  <!-- constellation "A": legs and crossbar -->
  <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M32 15 L17.5 49.5 M32 15 L46.5 49.5" stroke-opacity="0.62"/>
    <path d="M23.2 36 L40.8 36" stroke-opacity="0.45"/>
  </g>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="17.5" cy="49.5" r="2.9"/>
    <circle cx="46.5" cy="49.5" r="2.9"/>
    <circle cx="23.2" cy="36" r="2.1"/>
    <circle cx="40.8" cy="36" r="2.1"/>
    <circle cx="51" cy="14.5" r="1.3" fill-opacity="0.7"/>
  </g>

  <!-- apex: bright four-point star with soft glow -->
  <circle cx="32" cy="15" r="9" fill="url(#astrea-glow)"/>
  <path fill="#FFFFFF" d="M32 5.5 Q33.3 13.7 41.5 15 Q33.3 16.3 32 24.5 Q30.7 16.3 22.5 15 Q30.7 13.7 32 5.5 Z"/>
</svg>
