services:
  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
